name: DIO Bootcamp Monitor

on:
  schedule:
    # Executa diariamente às 08:00 BRT (11:00 UTC)
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      initial_notify:
        description: "Notificar bootcamps já existentes nesta execução?"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      send_daily_summary:
        description: "Enviar resumo diário?"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

# Impede execuções simultâneas
concurrency:
  group: dio-bootcamp-monitor
  cancel-in-progress: false

# Permissões mínimas necessárias
permissions:
  contents: write

jobs:
  monitor:
    name: Monitorar Bootcamps DIO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          # Garante histórico completo para o commit posterior
          fetch-depth: 1

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: |
          pytest tests/ -v --tb=short
        env:
          # Testes não precisam de credenciais reais
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""

      - name: Executar monitor
        run: |
          python src/main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INITIAL_NOTIFY: ${{ github.event.inputs.initial_notify || 'false' }}
          SEND_DAILY_SUMMARY: ${{ github.event.inputs.send_daily_summary || 'false' }}
          SEND_EMPTY_SUMMARY: "false"
          MAX_DETAIL_PAGES: "10"
          REQUEST_DELAY_SECONDS: "3"
          LOG_LEVEL: "INFO"
          DIO_BOOTCAMP_URL: "https://www.dio.me/bootcamp"

      - name: Verificar alterações no histórico
        id: check_changes
        run: |
          git diff --quiet data/bootcamps.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commitar histórico atualizado
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/bootcamps.json
          git commit -m "chore(monitor): atualiza histórico de bootcamps [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log de encerramento
        if: always()
        run: |
          echo "Monitor encerrado. Histórico alterado: ${{ steps.check_changes.outputs.changed || 'N/A' }}"
